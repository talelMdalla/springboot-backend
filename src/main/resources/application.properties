# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/khedma_tn
spring.datasource.username=postgres
spring.datasource.password=hhhhh55555
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (dialect pour PostgreSQL, pas MySQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=secretCleJWTSuperLongueEtSecurePourKhedmaTn1234567890
jwt.expiration=86400000

# CORS pour Flutter (optimisé pour multipart upload)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*,Content-Type,Authorization
spring.web.cors.allow-credentials=true

# Fix multipart upload (erreur 413 Payload Too Large)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=0

# Fix circular dependency (pour dev – supprime en prod)
spring.main.allow-circular-references=true